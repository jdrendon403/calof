version: "3.9"

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgtp}
      POSTGRES_USER: ${POSTGRES_USER:-sgtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgtp} -d ${POSTGRES_DB:-sgtp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sgtp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sgtp}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "0"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      MEDIA_X_ACCEL: "1"
    volumes:
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes:
      # nginx entrega las fotos y PDF solo tras validar el enlace firmado en Django (X-Accel-Redirect)
      - media_data:/srv/media:ro
    depends_on:
      - web
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sgtp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sgtp}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "0"
    volumes:
      - media_data:/app/backend/media
    depends_on:
      - web
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sgtp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sgtp}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "0"
    depends_on:
      - celery_worker
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
