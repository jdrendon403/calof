server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fotos desde el celular (ya comprimidas en el navegador) y firma del cliente
    client_max_body_size 15m;

    # Resolver "web" con el DNS de Docker en cada petición (no solo al arrancar):
    # nginx arranca aunque el backend aún no exista (p. ej. tras un reinicio del PC)
    # y sigue funcionando si el contenedor web se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://web:8000;

    # Proxy API → Django (Gunicorn)
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Fotos y PDF privados: solo accesibles por X-Accel-Redirect desde Django,
    # después de validar el enlace firmado (/api/archivos/<token>/).
    location /protected/ {
        internal;
        alias /srv/media/;
    }

    # Proxy Django Admin
    location /admin/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Archivos estáticos de Django (admin CSS/JS)
    location /static/ {
        proxy_pass $backend;
    }

    # React Router — todo lo demás va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
